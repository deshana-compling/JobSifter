[project]
name = "application-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=2.20.0",
    "google-generativeai>=0.8.6",
    "ipython>=9.17.0",
    "phonenumbers>=9.0.38",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "streamlit>=1.62.0",
]

[project.scripts]
application-assistant = "application_assistant:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
